name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

# The workflow only ever needs to read the code.
permissions:
  contents: read

# A second push to the same ref makes the first run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Report both operating systems even when one fails: they are separate
      # facts, and a macOS-only failure still needs the Linux result.
      fail-fast: false
      matrix:
        # Windows is absent on purpose. creack/pty compiles there, but
        # StartWithSize returns ErrUnsupported at runtime, so every PTY test
        # would fail on a runner that could never be made to pass. The Windows
        # build is still type checked: a later step cross-compiles the whole
        # module with GOOS=windows.
        #
        # The Linux label is pinned rather than ubuntu-latest. These tests
        # drive a real zsh over a PTY and read the terminal's line settings, so
        # they are sensitive to what the runner image happens to ship — enough
        # that they broke on an image the local machine could not reproduce.
        # ubuntu-latest moves from 24.04 to 26.04 between 19 Oct and 19 Nov
        # 2026 with nothing in this repo changing. Pinned, moving forward is a
        # deliberate edit and a visible test failure, not a surprise on a
        # Tuesday.
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: Install zsh
        # internal/terminal and internal/telegram drive a real /bin/zsh for the
        # persistent-shell tests, so the runner has to have one.
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh

      # Ordered cheapest-first, so a formatting slip fails in seconds instead
      # of after the full race suite.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Cross-compile for Windows
        # Windows is not in the matrix, so nothing else compiles the
        # `//go:build windows` files — and a platform-tagged symbol that does
        # not exist on Windows is invisible until someone tries to build there.
        # A bare syscall.Kill in internal/instance was exactly that. Cross-
        # compiling and cross-vetting on the Linux runner closes the gap. Vet
        # also compiles the package's test files for the Windows target, so
        # process_test.go is type checked there even though it cannot run.
        run: |
          GOOS=windows go build ./...
          GOOS=windows go vet ./...

      - name: Test
        # The race detector is the point of this job, not an extra: the
        # duplicate read of a shared timestamp in the agent relay only shows up
        # here. The timeout is generous because the PTY tests wait on real
        # shells.
        run: go test -race -timeout 15m ./...

      - name: Staticcheck
        # Runs on both operating systems, because staticcheck analyses compiled
        # code and the compilation depends on GOOS. service_other.go and
        # service_other_test.go carry `//go:build !darwin && !linux`, so on a
        # macOS-only run they are not even parsed: a Linux-only staticcheck
        # passed over a dead `if err != nil` around a stub that can never return
        # nil (SA4023), and then over two test helpers nothing called (U1000).
        # Neither was reachable from a macOS shell, and both turned a green local
        # run red.
        #
        # fail-fast is already off above, so a failure on one platform still
        # reports the other rather than hiding it.
        #
        # Pinned on purpose: an unpinned @latest would let a new release turn a
        # green build red for reasons that have nothing to do with this commit.
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
