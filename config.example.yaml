# TermiLink configuration example.
# Copy to config.yaml and adjust. Secrets may be supplied via environment
# variables (see .env.example) instead of being written here.

telegram:
  # Either put the token here directly or use ${TELEGRAM_BOT_TOKEN}.
  bot_token: ${TELEGRAM_BOT_TOKEN}

  # Maximum file size in bytes for /get and automatic uploads.
  # Default (and Telegram's document limit): 52428800 (50 MB).
  max_file_bytes: 52428800

  # Optional: deliver files too big for Telegram via a temporary anonymous
  # link instead of failing. Values: "" (disabled), uguu.se (auto-deletes
  # after ~3 hours, max ~128 MB), catbox.moe (up to 200 MB, persists until
  # purged). Link transfers require owner approval in chat and are shown in
  # the audit trail. Only use for non-confidential files — the file is public
  # while the unguessable link is valid.
  # big_file_link_host: uguu.se

security:
  # Owner has full access (free cd anywhere). If unset, the first
  # allowed_user becomes the owner. All other allowed_users are workers:
  # they can only switch between configured projects and run commands
  # inside the selected project.
  owner: 123456789

  # Telegram user IDs allowed to execute commands. At least one is required.
  allowed_users:
    - 123456789

  # Gate destructive commands (rm -rf /, dd to /dev, sudo, shutdown, ...)
  # behind a chat approval. Values: all (default), worker, off.
  approve_dangerous: all

  # Optional extra regex patterns that also trigger approval:
  # dangerous_patterns:
  #   - "git\\s+push\\s+(--force|-f)"

  # Write a JSONL audit trail of security-sensitive events (commands, approvals,
  # blocked access, project switches, ...). Empty = default
  # ~/.termilink/audit.log; "off" disables it.
  # audit_log: /absolute/path/to/audit.log

workspace:
  # Optional: restrict filesystem access to these roots.
  allowed:
    - /Users/user/projects

terminal:
  shell: /bin/zsh
  command_timeout: 30m
  max_output_bytes: 1048576

projects:
