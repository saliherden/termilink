# TermiLink configuration example.
# Copy to config.yaml and adjust. Secrets may be supplied via environment
# variables (see .env.example) instead of being written here.

telegram:
  # Either put the token here directly or use ${TELEGRAM_BOT_TOKEN}.
  bot_token: ${TELEGRAM_BOT_TOKEN}

  # Maximum file size in bytes for /get and automatic uploads.
  # Default (and Telegram's document limit): 52428800 (50 MB).
  max_file_bytes: 52428800

  # Optional: deliver files too big for Telegram via a temporary anonymous
  # link instead of failing. Values: "" (disabled), uguu.se (auto-deletes
  # after ~3 hours, max ~128 MB), catbox.moe (up to 200 MB, persists until
  # purged). Link transfers require owner approval in chat and are shown in
  # the audit trail. Only use for non-confidential files — the file is public
  # while the unguessable link is valid.
  # big_file_link_host: uguu.se

security:
  # Owner has full access (free cd anywhere). If unset, the first
  # allowed_user becomes the owner. All other allowed_users are workers:
  # they can only switch between configured projects and run commands
  # inside the selected project.
  owner: 123456789

  # Telegram user IDs allowed to execute commands. At least one is required.
  allowed_users:
    - 123456789

  # Gate destructive commands (rm -rf /, dd to /dev, sudo, shutdown, ...)
  # behind a chat approval. Values: all (default), worker, off.
  approve_dangerous: all

  # Optional extra regex patterns that also trigger approval:
  # dangerous_patterns:
  #   - "git\\s+push\\s+(--force|-f)"

  # Write a JSONL audit trail of security-sensitive events (commands, approvals,
  # blocked access, project switches, ...). Empty = default
  # ~/.termilink/audit.log; "off" disables it.
  # audit_log: /absolute/path/to/audit.log

  # Optional: cap the audit log size in bytes; the current file is rotated to
  # "<path>.1" before the next entry once it grows past this. 0 = unlimited.
  # audit_max_bytes: 26214400   # 25 MiB

  # Optional: how many rotated archives to keep. 1 (the default) replaces
  # ".1" on every rotation, so the log never holds more than one cap's worth of
  # history; higher values keep ".1", ".2", ... so an investigation can reach
  # back further. Lowering this clears the archives past the new count.
  # audit_keep: 5

# Optional: where persisted terminal sessions live. Empty = default
# ~/.termilink/state.json. Must be absolute. Set this when running under a
# service account that has no usable home directory, otherwise the agent
# refuses to start rather than silently keeping sessions in memory.
# state_file: /var/lib/termilink/state.json

workspace:
  # Optional: restrict filesystem access to these roots.
  allowed:
    - /Users/user/projects

# Interactive shell. max_output_bytes bounds two things: the output kept for the
# /status tail, and the output captured per command. A command that produces
# more than this keeps its most recent bytes rather than failing — the exit
# status is still reported exactly. Values below 65536 are raised to 65536,
# below which a command's own completion markers leave no room for useful output.
terminal:
  shell: /bin/zsh
  command_timeout: 30m
  max_output_bytes: 1048576

# Interactive coding-agent bridge (opencode / claude / codex / gemini). The
# CLI is started in the selected project directory inside a PTY; its screen is
# relayed to the chat. Only the owner can start/control it.
agent:
  enabled: true
  # "" detects the first CLI available on PATH (opencode, claude, codex,
  # gemini). Set a bare name or an absolute path to pin one.
  # command: opencode
  screen:
    # "png" relays the agent screen as a colored image, "text" as a code block.
    # This governs the live screen only. The screen posted when a session ends is
    # always text, whatever this says: it is written output rather than a picture
    # of one, so it stays copyable and searchable.
    mode: png

projects:
